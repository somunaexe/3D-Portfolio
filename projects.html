<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/flapjack.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Projects | SuperSomu</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong one.
      (function () {
        var ids = ['light', 'bulfighter-light', 'bulwriter-light', 'bulwriter-dark', 'bulfighter-dark', 'dark'];
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('portfolio:theme');
          if (ids.indexOf(saved) !== -1) theme = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-mode', theme.indexOf('light') !== -1 ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/projectsMain.jsx"></script>
  </body>
</html>
